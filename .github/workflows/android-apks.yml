name: JIB Android APKs
concurrency:
  group: jib-apks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/customer/**'
      - 'apps/courier/**'
      - 'apps/merchant/**'
      - '.github/workflows/android-apks.yml'
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/merchant/**'
      - 'apps/courier/**'
      - '.github/workflows/android-apks.yml'
jobs:
  build:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, courier, merchant]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project files
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=android --org com.jib --project-name jib_${{ matrix.app }} --no-pub .
      - name: Ensure app-specific Android permissions
        working-directory: apps/${{ matrix.app }}
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permissions = ["android.permission.INTERNET"]

          # Only the courier app runs a user-consented location foreground service.
          # The service starts while the app is visible and keeps its ongoing
          # notification while location updates continue in the background.
          if os.environ["APP_NAME"] == "courier":
              permissions.extend([
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.FOREGROUND_SERVICE",
                  "android.permission.FOREGROUND_SERVICE_LOCATION",
                  "android.permission.POST_NOTIFICATIONS",
              ])

          missing = [
              f'<uses-permission android:name="{name}"/>'
              for name in permissions
              if f'android:name="{name}"' not in content
          ]
          if missing:
              end = content.find(">", content.find("<manifest"))
              content = content[:end + 1] + "\\n    " + "\\n    ".join(missing) + content[end + 1:]
              path.write_text(content)
          PY
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: flutter test
      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jib-${{ matrix.app }}-android-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
