name: JIB Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
      - 'apps/merchant/**'
      - 'apps/courier/**'
      - '.github/workflows/android-apks.yml'
jobs:
  build:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, courier, merchant]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project files
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=android --org com.jib --project-name jib_${{ matrix.app }} --no-pub .
      - name: Ensure release APK has internet permission
        working-directory: apps/${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in content:
              end = content.find(">", content.find("<manifest"))
              content = content[:end + 1] + "\n    " + permission + content[end + 1:]
              path.write_text(content)
          PY
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: flutter test
      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jib-${{ matrix.app }}-android-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
