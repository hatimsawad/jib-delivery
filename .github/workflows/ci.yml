name: JIB CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm install
      - name: Apply non-breaking dependency security fixes
        working-directory: apps/admin
        run: npm audit fix --no-fund || true
      - name: Summarize admin dependency audit
        working-directory: apps/admin
        run: |
          npm audit --json > /tmp/jib-admin-audit.json || true
          node -e 'const r=require("/tmp/jib-admin-audit.json"); console.log("Audit summary:", JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(r.vulnerabilities ?? {})) console.log(`${v.severity}: ${name}; range=${v.range}; via=${JSON.stringify(v.via)}; fixAvailable=${JSON.stringify(v.fixAvailable)}`)'
      - name: Upload admin package lock
        uses: actions/upload-artifact@v4
        with:
          name: jib-admin-package-lock
          path: apps/admin/package-lock.json
          if-no-files-found: error
      - name: Upload admin dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: jib-admin-npm-audit
          path: /tmp/jib-admin-audit.json
          if-no-files-found: error
      - name: Lint admin dashboard
        working-directory: apps/admin
        run: npm run lint
      - name: Build admin dashboard
        working-directory: apps/admin
        run: npm run build
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, courier, merchant]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        working-directory: apps/${{ matrix.app }}
        run: flutter test
